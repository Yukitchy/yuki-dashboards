 {n:"Podcast文庫",en:"BUNKO",cat:"PODCAST",desc:"自分の全11番組・700話のPodcastをAIで文字起こしして読み物化。番組棚とタグ検索で、過去の放送が「読める図書館」になった。",num:"700",unit:"話",url:"https://bunko.yuukipodcast.com",b:"pub",note:"公開中"},

[data-v=e] .eyebrow{font-family:"DotGothic16",monospace;color:#FF9F1C;font-size:15px;letter-spacing:.2em}
[data-v=e] h1{font-family:"DotGothic16",monospace;font-size:clamp(30px,5.6vw,50px);font-weight:400;color:#7CFC9B;margin:8px 0 6px;text-shadow:0 0 14px rgba(124,252,155,.35)}
[data-v=e] .lead{color:#93A3B4;font-size:14px;max-width:44em}
[data-v=e] .stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:18px}
[data-v=e] .stat .n{font-family:"DotGothic16",monospace;font-size:28px;color:#FF9F1C}
[data-v=e] .stat .l{font-size:13px;color:#93A3B4}
[data-v=e] .board{margin:24px 0 40px;background:#000;border-radius:14px;padding:14px 0;box-shadow:inset 0 0 0 1px #232B33}
[data-v=e] .bh{display:grid;grid-template-columns:120px 1fr 130px 110px;gap:14px;padding:6px 22px 10px;
  font-family:"DotGothic16",monospace;font-size:14px;color:#5C6B7A;border-bottom:1px solid #1B2229}
[data-v=e] .card{display:grid;grid-template-columns:120px 1fr 130px 110px;gap:14px;align-items:center;
  padding:13px 22px;border-bottom:1px solid #14191E;transition:background .14s}
[data-v=e] a.card:hover{background:#0A1A10}
[data-v=e] .cat{font-family:"DotGothic16",monospace;font-size:14px;color:#FF9F1C}
[data-v=e] .nm{font-family:"DotGothic16",monospace;font-size:20px;color:#7CFC9B}
[data-v=e] .nm small{font-size:13px;color:#3E7A4C;margin-left:10px;letter-spacing:.08em}
[data-v=e] .ds{display:block;font-family:"Noto Sans JP",sans-serif;font-size:12.9px;color:#93A3B4;line-height:1.65;margin-top:2px}
[data-v=e] .num{font-family:"DotGothic16",monospace;font-size:18px;color:#E8EDF2;text-align:right}
[data-v=e] .num small{display:block;font-size:12.9px;color:#5C6B7A;font-family:"Noto Sans JP",sans-serif}
[data-v=e] .st{font-family:"DotGothic16",monospace;font-size:15px;text-align:right}
[data-v=e] .st.pub{color:#7CFC9B;animation:blink 2.2s steps(2) infinite}
[data-v=e] .st.loc{color:#FF9F1C}[data-v=e] .st.wip{color:#6FB6FF}
@keyframes blink{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){[data-v=e] .st.pub{animation:none}}
@media(max-width:760px){[data-v=e] .bh{display:none}[data-v=e] .card{grid-template-columns:1fr 100px;gap:4px 10px}
 [data-v=e] .cat{grid-column:1 / -1}[data-v=e] .num,[data-v=e] .st{text-align:right}}
`,html(){return `<div class="wrap">
<header><div class="eyebrow">YUKI DASHBOARD LINE — 運行情報</div>
<h1>ダッシュボード発車標</h1>
<p class="lead">AI（Claude）と共作したデータまとめサービス14系統、ぜんぶ定刻運行中。</p></header>
<div class="board"><div class="bh"><span>系統</span><span>サービス</span><span style="text-align:right">実績</span><span style="text-align:right">状態</span></div>
${S.map(s=>wrapA(s,`
 <span class="cat">${s.cat}</span>
 <div><span class="nm">${esc(s.n)}<small>${s.en}</small></span><span class="ds">${esc(s.desc)}</span></div>
 <div class="num">${s.num?s.num:"—"}<small>${s.unit}</small></div>
 <span class="st ${s.b}">${s.b==="pub"?"公開中":s.note}</span>`)).join("")}
</div></div>`}};

/* ===== 切替 ===== */
const V={a:A,b:B,c:C,d:D,e:E};
const stage=document.getElementById("stage"),bar=document.getElementById("bar");
let styleEl=document.createElement("style");document.head.appendChild(styleEl);
function show(k){
  styleEl.textContent=V[k].css;
  stage.setAttribute("data-v",k);
  stage.innerHTML=V[k].html();
  document.querySelectorAll("#bar button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  try{localStorage.setItem("zukan-v",k)}catch(e){}
  window.scrollTo(0,0);
}
Object.keys(V).forEach(k=>{
  const b=document.createElement("button");b.dataset.k=k;b.textContent=V[k].label;
  b.onclick=()=>show(k);bar.appendChild(b);
});
let init="a";try{init=localStorage.getItem("zukan-v")||"a"}catch(e){}
show(V[init]?init:"a");
</script>
</body>
</html>
